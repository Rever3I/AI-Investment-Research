[build-system]
# 77 is where the SPDX `license` expression and `license-files` are understood.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-stock-researcher"
version = "2.0.0"
description = "Agentic stock researcher: buy-side research with sourced, reproducible numbers"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

# The library lives inside the skill directory so that one directory is a
# working install on its own. `agentic-stock-researcher` is not an importable name,
# so the package root is the skill folder and the package is `airesearch`.
[tool.setuptools]
package-dir = {"" = "skills/agentic-stock-researcher"}
packages = [
    "airesearch",
    "airesearch.data",
    "airesearch.data.adapters",
    "airesearch.factcontract",
    "airesearch.valuation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
