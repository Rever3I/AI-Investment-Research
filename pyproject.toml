[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-research"
version = "0.1.0"
description = "A portable, layered investment-research pipeline delivered as SKILL.md packages"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

# The skill directories (skills/research-intake/ and its siblings) hold SKILL.md
# rather than Python, and their hyphenated names are not importable, so they are
# not packages. Install this repo from a clone — `pip install -e .` puts the
# shared library on the path while the SKILL.md files stay where a host can read
# them. A built wheel would carry the library without the skills it serves.
[tool.setuptools]
packages = [
    "skills",
    "skills._lib",
    "skills._lib.data",
    "skills._lib.factcontract",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
