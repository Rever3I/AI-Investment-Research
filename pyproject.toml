[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-research"
version = "0.1.0"
description = "A portable, layered investment-research pipeline delivered as SKILL.md packages"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

# The library lives inside the skill directory so that one directory is a
# working install on its own. `investment-research` is not an importable name,
# so the package root is the skill folder and the package is `airesearch`.
[tool.setuptools]
package-dir = {"" = "skills/investment-research"}
packages = [
    "airesearch",
    "airesearch.data",
    "airesearch.data.adapters",
    "airesearch.factcontract",
    "airesearch.valuation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
